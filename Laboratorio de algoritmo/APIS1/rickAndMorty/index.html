<!DOCTYPE html>
<html lang="en">

<body>

    <div id="contenedor"></div>
    <script>
        async function obtenerDatos() {
            try {
                const url = "https://rickandmortyapi.com/api/character/?page=22";
                const res = await fetch(url);
                let datos = await res.json();
                console.log(datos);

                let nombres = datos.results.map(personaje => personaje.name.toUpperCase())

                let especie = datos.results.filter(personaje => personaje.species == "Humanoid")

                let ind = datos.results.find(personaje => personaje.name == "Phone-person")

                //datos.results.forEach(personaje => {
                //    const nombre = personaje.name;
                //    const especie =  personaje.species;
                //    const vivo = personaje.status; 
                //console.log(`${nombre} es de especie ${especie} y esta ${vivo}` )
                //})

                let totalEpisodios = datos.results.reduce((acumulador, personaje) => {
                    return acumulador + personaje.episode.length;
                });
                //console.log(ind)

                let simplificado = datos.results.map(personaje => ({
                    name: personaje.name,
                    id: personaje.id,
                    status: personaje.status,
                    image: personaje.image
                }));
                //console.log(simplificado);

                let vivosTi = datos.results.filter(personaje => personaje.status == 'alive' || personaje.origin.name == "Earth")

                //console.log(vivosTi)


                let alien = datos.results.find(personaje => personaje.species == "Alien" || personaje.status == "Alive")

                //console.log(alien)

                let estados = datos.results.reduce((acumulador, personaje) => {

                    let estado = personaje.status;
                    if (acumulador[estado]) {
                        acumulador[estado] += 1;
                    } else {
                        acumulador[estado] = 1;
                    }
                    return acumulador;
                });

                //console.log(estados);

                datos.results.forEach(personaje => {
                    if (personaje.episode.length >= 2){
                        const ca =  personaje.length 
                        const nombre = personaje.name;
                        console.log(`${nombre} aparece en ${ca}`)
                    }
                })




                datos.results.forEach(personaje => {

                    document.getElementById("contenedor").innerHTML +=
                        `<div class= card> 
                        <p>${personaje.name}</p>
                        <img src=${personaje.image}  alt=>
                     <div>
                        `;
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }

        obtenerDatos();


    </script>
    <style>

            border: 1px solid #334155;

        }
