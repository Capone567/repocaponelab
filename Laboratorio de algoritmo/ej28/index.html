<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Lista de Tareas</title>
  <style>
    /* Un diseño muy básico para que no se vea feo */
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
    .input-container { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .btn-eliminar { background-color: #ff4d4d; color: white; border: none; border-radius: 4px; padding: 4px 8px; }
  </style>
</head>
<body>

  <h2>Mis Tareas</h2>

  <div class="input-container">
    <input type="text" id="tareaInput" placeholder="Escribe una nueva tarea...">
    <button id="btnAgregar">Agregar</button>
  </div>

  <ul id="lista"></ul>

  <script src="script.js"></script>
</body>
</html>
